[versions]
# Android SDK config (was buildSrc/DefaultConfig.kt)
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# Build tooling
agp = "8.13.2"
kotlin = "2.2.20"
navigationSafeArgs = "2.9.7"

# AndroidX
core = "1.2.0"
appCompat = "1.1.0"
constraintLayout = "1.1.3"
legacySupport = "1.0.0"
material = "1.4.0"
lifecycleViewModel = "2.3.1"
lifecycleRuntime = "2.2.0"
lifecycleLiveData = "2.3.1"
room = "2.8.4"
navigation = "2.7.7"
activityKtx = "1.8.1"
fragmentKtx = "1.5.6"
paging = "3.3.0"
swipeRefresh = "1.1.0"
# NOTE: previously resolved via Version.swipeRefresh (1.1.0) in buildSrc; kept as-is to avoid behaviour changes.
recyclerView = "1.1.0"

# Kotlin
coroutines = "1.5.1"
coroutinesTest = "1.6.4"

# DI
dagger = "2.58"
androidxHilt = "1.3.0"

# Networking
retrofit = "2.6.0"
okHttp = "4.9.0"
loggingInterceptor = "4.5.0"

# UI / misc
glide = "4.11.0"
timeAgo = "4.0.3"
lottie = "4.1.0"
shimmer = "0.5.0"
flowbinding = "1.2.0"
pluto = "2.2.2"

# Testing
junit = "4.13.2"
robolectric = "4.9.2"
testCoreKtx = "1.5.0"
androidxJunit = "1.1.1"
espresso = "3.2.0"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupport" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewModel" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLiveData" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swipeRefresh" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerView" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okHttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }

# UI / misc
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
timeago = { module = "com.github.marlonlom:timeago", version.ref = "timeAgo" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }
flowbinding-android = { module = "io.github.reactivecircus.flowbinding:flowbinding-android", version.ref = "flowbinding" }

# Pluto (debug tooling)
pluto = { module = "com.plutolib:pluto", version.ref = "pluto" }
pluto-no-op = { module = "com.plutolib:pluto-no-op", version.ref = "pluto" }
pluto-bundle-core = { module = "com.plutolib.plugins:bundle-core", version.ref = "pluto" }
pluto-bundle-core-no-op = { module = "com.plutolib.plugins:bundle-core-no-op", version.ref = "pluto" }
pluto-network-okhttp = { module = "com.plutolib.plugins:network-interceptor-okhttp", version.ref = "pluto" }
pluto-network-okhttp-no-op = { module = "com.plutolib.plugins:network-interceptor-okhttp-no-op", version.ref = "pluto" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "testCoreKtx" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Build logic (compileOnly in build-logic/convention)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
lifecycle = ["androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-runtime-ktx"]
networking = ["retrofit", "retrofit-converter-gson", "okhttp-logging-interceptor", "okhttp"]
room = ["androidx-room-ktx", "androidx-room-runtime"]
hilt-compilers = ["androidx-hilt-compiler", "hilt-android-compiler"]
pluto-debug = ["pluto", "pluto-bundle-core", "pluto-network-okhttp"]
pluto-release = ["pluto-no-op", "pluto-bundle-core-no-op", "pluto-network-okhttp-no-op"]
unit-test = ["junit", "kotlinx-coroutines-test", "robolectric", "androidx-test-core-ktx"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationSafeArgs" }

# Convention plugins (defined in build-logic)
newsapp-android-application = { id = "newsapp.android.application" }
newsapp-android-library = { id = "newsapp.android.library" }
newsapp-android-hilt = { id = "newsapp.android.hilt" }
